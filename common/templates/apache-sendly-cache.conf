# Sendly — cache navigateur des assets agrégés.
# /media/js/app.js et /media/css/*.css changent à CHAQUE déploiement sous la
# même URL : no-cache impose la revalidation (304 si inchangé — coût nul),
# là où l'absence d'en-tête laissait Chrome cacher « au jugé » et servir du
# JS périmé après chaque mise en prod.
<LocationMatch "^/media/(js|css)/">
    Header set Cache-Control "no-cache"
</LocationMatch>
