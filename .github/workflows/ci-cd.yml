name: CI/CD Mautic Image

on:
  # Trigger automatique depuis le repo mautic
  repository_dispatch:
    types: [mautic-source-updated]

  # Trigger quand le Dockerfile ou scripts changent
  push:
    branches: [main]
    paths:
      - 'Dockerfile.eweb'
      - 'common/**'

  # Trigger manuel pour builds et/ou deploy
  workflow_dispatch:
    inputs:
      action:
        description: 'Action à exécuter'
        required: true
        type: choice
        options:
          - build-and-deploy
          - build-only
          - deploy-only
        default: 'deploy-only'
      environment:
        description: 'Environnement cible (pour deploy)'
        required: true
        type: choice
        options:
          - development
          - production
        default: 'development'
      mautic_branch:
        description: 'Branche mautic (pour build) - ex: 7.x, 7.x-dev'
        required: false
        default: '7.x-dev'
      image_tag:
        description: 'Tag image (ex: latest, dev, sha-xxx)'
        required: false
        default: 'dev'
      target_slug:
        description: 'Slug instance spécifique (laisser vide = TOUTES)'
        required: false
        default: ''

env:
  REGISTRY: ${{ secrets.IONOS_REGISTRY_URL }}
  IMAGE_NAME: eweb/mautic
  MAUTIC_REPO: https://github.com/eweb-agency/mautic.git

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # BUILD - Si push, repository_dispatch OU action contient build
  # ════════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' || 
      github.event_name == 'repository_dispatch' || 
      (github.event_name == 'workflow_dispatch' && (inputs.action == 'build-and-deploy' || inputs.action == 'build-only'))
    outputs:
      main_tag: ${{ steps.meta.outputs.main_tag }}
      sha: ${{ steps.meta.outputs.sha }}
      should_deploy: ${{ steps.meta.outputs.should_deploy }}

    steps:
      - name: Checkout docker-mautic
        uses: actions/checkout@v4

      - name: Compute tags and branch
        id: meta
        run: |
          # Sources possibles
          DISPATCH_BRANCH="${{ github.event.client_payload.branch }}"
          DISPATCH_TAG="${{ github.event.client_payload.target_tag }}"
          DISPATCH_COMMIT="${{ github.event.client_payload.commit_short }}"
          INPUT_BRANCH="${{ inputs.mautic_branch }}"
          INPUT_TAG="${{ inputs.image_tag }}"
          
          # Déterminer la branche mautic et le tag
          if [[ -n "$DISPATCH_BRANCH" ]]; then
            # repository_dispatch depuis mautic
            MAUTIC_BRANCH="$DISPATCH_BRANCH"
            MAIN_TAG="$DISPATCH_TAG"
            SHA_SHORT="$DISPATCH_COMMIT"
            SHOULD_DEPLOY="false"  # Pas d'auto-deploy pour Mautic
            echo "🔗 Triggered by mautic push: $MAUTIC_BRANCH"
          elif [[ -n "$INPUT_BRANCH" && "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # workflow_dispatch manuel
            MAUTIC_BRANCH="$INPUT_BRANCH"
            MAIN_TAG="$INPUT_TAG"
            SHA_SHORT=$(git ls-remote ${{ env.MAUTIC_REPO }} refs/heads/$MAUTIC_BRANCH | cut -c1-7)
            SHOULD_DEPLOY="${{ inputs.action == 'build-and-deploy' }}"
            echo "✋ Manual trigger: $MAUTIC_BRANCH → $MAIN_TAG"
          else
            # push sur main (rebuild avec dernière version prod)
            MAUTIC_BRANCH="7.x"
            MAIN_TAG="latest"
            SHA_SHORT=$(git ls-remote ${{ env.MAUTIC_REPO }} refs/heads/7.x | cut -c1-7)
            SHOULD_DEPLOY="false"
            echo "📦 Dockerfile changed, rebuilding with 7.x"
          fi
          
          # Tags à générer
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${MAIN_TAG}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHA_SHORT}"
          
          echo "mautic_branch=$MAUTIC_BRANCH" >> $GITHUB_OUTPUT
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "main_tag=$MAIN_TAG" >> $GITHUB_OUTPUT
          echo "sha=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "should_deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute PHP version
        id: phpver
        run: |
          VERSION="${{ steps.meta.outputs.mautic_branch }}"
          if [[ "$VERSION" == "main" ]] || [[ "$VERSION" == "7.x-dev" ]] || [[ "$VERSION" == "7.x" ]]; then
            PHPVER="8.3"
          else
            MAJOR=$(echo "$VERSION" | cut -d. -f1 | tr -d 'v')
            if [ "$MAJOR" = "5" ]; then PHPVER="8.2";
            elif [ "$MAJOR" = "6" ]; then PHPVER="8.3";
            elif [ "$MAJOR" = "7" ]; then PHPVER="8.3";
            else PHPVER="8.3"; fi
          fi
          echo "php_version=$PHPVER" >> $GITHUB_OUTPUT
          echo "base_tag=${PHPVER}-apache-bookworm" >> $GITHUB_OUTPUT

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.IONOS_REGISTRY_USERNAME }}
          password: ${{ secrets.IONOS_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.eweb
          push: true
          platforms: linux/amd64
          build-args: |
            BASE_TAG=${{ steps.phpver.outputs.base_tag }}
            MAUTIC_CORE_REPO=${{ env.MAUTIC_REPO }}
            MAUTIC_CORE_BRANCH=${{ steps.meta.outputs.mautic_branch }}
            FLAVOUR=apache
            CACHEBUST=${{ steps.meta.outputs.sha }}
            SENDLY_RELEASE=${{ github.run_id }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          echo "## 🐳 Mautic Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Mautic Branch** | \`${{ steps.meta.outputs.mautic_branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Main Tag** | \`${{ steps.meta.outputs.main_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SHA Tag** | \`sha-${{ steps.meta.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **PHP** | ${{ steps.phpver.outputs.php_version }} |" >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════════════════
  # DEPLOY - Manuel uniquement OU après build-and-deploy
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-only') ||
        (needs.build.result == 'success' && needs.build.outputs.should_deploy == 'true')
      )
    environment: ${{ inputs.environment || 'development' }}

    steps:
      - name: Compute deploy tag
        id: deploy_tag
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ -n "${{ needs.build.outputs.main_tag }}" ]]; then
            TAG="${{ needs.build.outputs.main_tag }}"
          else
            TAG="dev"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy Mautic via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.SSH_DEPLOY_PATH }}
            
            IMAGE_TAG="${{ steps.deploy_tag.outputs.tag }}"
            TARGET_SLUG="${{ inputs.target_slug }}"
            
            deploy_org() {
              local slug=$1
              local org_dir="organizations/${slug}"
              
              if [[ -f "${org_dir}/docker-compose.yml" ]]; then
                echo "🔄 Deploying Mautic for ${slug} with tag ${IMAGE_TAG}..."
                
                # Mettre à jour MAUTIC_TAG dans le .env de l'org
                sed -i "s/^MAUTIC_TAG=.*/MAUTIC_TAG=${IMAGE_TAG}/" "${org_dir}/.env"
                
                # Pull et restart
                docker compose -f "${org_dir}/docker-compose.yml" pull
                docker compose -f "${org_dir}/docker-compose.yml" up -d
                
                echo "✅ ${slug} deployed"
              fi
            }
            
            if [[ -n "$TARGET_SLUG" ]]; then
              # Instance spécifique
              ORG_DIR="organizations/${TARGET_SLUG}"
              if [[ -f "${ORG_DIR}/docker-compose.yml" ]]; then
                deploy_org "$TARGET_SLUG"
              else
                echo "❌ Instance ${TARGET_SLUG} not found"
                exit 1
              fi
            else
              # Toutes les instances
              DEPLOYED=0
              for ORG_DIR in organizations/*/; do
                if [[ -f "${ORG_DIR}docker-compose.yml" ]]; then
                  SLUG=$(basename "$ORG_DIR")
                  deploy_org "$SLUG"
                  DEPLOYED=$((DEPLOYED + 1))
                fi
              done
              echo "✅ ${DEPLOYED} Mautic instance(s) deployed with tag ${IMAGE_TAG}"
            fi

      - name: Deploy summary
        run: |
          echo "## 🚀 Mautic Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment || 'development' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag** | \`${{ steps.deploy_tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | ${{ inputs.target_slug || 'ALL instances' }} |" >> $GITHUB_STEP_SUMMARY

