name: Copilote IA — diagnostic env (lecture seule)

# Constate, SANS RIEN MODIFIER, l'état des deux variables du Copilot sur
# chaque tenant : SENDLY_ANTHROPIC_KEY (présence seulement, jamais la
# valeur) et SENDLY_AI_ENTITLED (valeur 0/1), dans le FICHIER .env et
# dans l'environnement du CONTENEUR web qui tourne. Posé le 27/08 pour
# élucider le retour du popup teaser après le rollout de l'assistant.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement"
        required: true
        type: choice
        options: [development, production]
        default: development

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Lire l'état (fichier vs conteneur)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -u
            BASE="${{ secrets.SSH_DEPLOY_PATH }}/organizations"
            for ORG_DIR in "$BASE"/*/; do
              SLUG="$(basename "$ORG_DIR")"
              ENV_FILE="$ORG_DIR/.env"
              [ -f "$ENV_FILE" ] || continue
              if grep -q '^SENDLY_ANTHROPIC_KEY=..*' "$ENV_FILE"; then FK="présente"; else FK="ABSENTE"; fi
              FE="$(grep '^SENDLY_AI_ENTITLED=' "$ENV_FILE" | cut -d= -f2)"; [ -n "$FE" ] || FE="(absente)"
              WEB="mautic_${SLUG}_web"
              if [ -n "$(docker ps -q -f name=^${WEB}$)" ]; then
                CK="$(docker exec "$WEB" sh -c '[ -n "${SENDLY_ANTHROPIC_KEY:-}" ] && echo présente || echo ABSENTE')"
                CE="$(docker exec "$WEB" sh -c 'echo "${SENDLY_AI_ENTITLED:-(absente)}"')"
                DEPUIS="$(docker inspect "$WEB" --format '{{.State.StartedAt}}')"
              else
                CK="(conteneur arrêté)"; CE="(conteneur arrêté)"; DEPUIS="-"
              fi
              echo "$SLUG | .env: clé=$FK droit=$FE | conteneur: clé=$CK droit=$CE | démarré=$DEPUIS"
            done
            echo "── modifications récentes des .env ──"
            ls -l --time-style=full-iso "$BASE"/*/.env 2>/dev/null || true
